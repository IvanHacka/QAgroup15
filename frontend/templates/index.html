<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bug Tracking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, textarea, select, button {
            width: 300px;
            padding: 6px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .bug-card {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<h1>Create Bug Report</h1>

<!-- Success / Error Message -->
<div id="message"></div>

<!-- Bug Creation Form -->
<label for="title">Title *</label>
<input type="text" id="title" placeholder="Bug title">

<label for="description">Description *</label>
<textarea id="description" placeholder="Describe the bug"></textarea>

<label for="priority">Priority</label>
<select id="priority">
    <option value="LOW">Low</option>
    <option value="MEDIUM">Medium</option>
    <option value="HIGH">High</option>
</select>

<button onclick="createBug()">Create Bug</button>

<hr>

<h2>Filter Bugs by Status</h2>

<select id="statusFilter">
    <option value="">All</option>
    <option value="OPEN">OPEN</option>
    <option value="IN_PROGRESS">IN_PROGRESS</option>
    <option value="COMPLETED">COMPLETED</option>
    <option value="CLOSED">CLOSED</option>
</select>

<button onclick="loadBugs()">Filter</button>

<div id="bugList" style="margin-top: 20px;"></div>

<script>
function createBug() {
    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;
    const priority = document.getElementById("priority").value;

    fetch("/api/bugs", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            description: description,
            priority: priority,
            status: "OPEN",
            tester_id: 1
        })
    })
    .then(response => response.json())
    .then(data => {
        const messageDiv = document.getElementById("message");

        if (data.message) {
            messageDiv.innerText = data.message;
            messageDiv.className = "success";

            document.getElementById("title").value = "";
            document.getElementById("description").value = "";

            // ✅ refresh bug list after creation
            loadBugs();
        } else if (data.error) {
            messageDiv.innerText = data.error;
            messageDiv.className = "error";
        }
    })
    .catch(() => {
        const messageDiv = document.getElementById("message");
        messageDiv.innerText = "Failed to create bug";
        messageDiv.className = "error";
    });
}

function loadBugs() {
    const status = document.getElementById("statusFilter").value;

    let url = "/api/bugs";
    if (status) {
        url += "?status=" + status;
    }

    fetch(url)
        .then(response => response.json())
        .then(data => renderBugs(data))
        .catch(() => {
            document.getElementById("bugList").innerHTML =
                "<p class='error'>Failed to load bugs</p>";
        });
}

function renderBugs(bugs) {
    const list = document.getElementById("bugList");
    list.innerHTML = "";

    if (!bugs || bugs.length === 0) {
        list.innerHTML = "<p>No bugs found.</p>";
        return;
    }

    bugs.forEach(bug => {
        const div = document.createElement("div");
        div.className = "bug-card";

        div.innerHTML = `
            <p><strong>Bug ID:</strong> ${bug.id}</p>
            <p><strong>Status:</strong> ${bug.status}</p>
            <p><strong>Created:</strong> ${bug.created ?? "-"}</p>
        `;
        list.appendChild(div);
    });
}

// Load all bugs when page opens
window.onload = loadBugs;
</script>

</body>
</html>
