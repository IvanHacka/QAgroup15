<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, user-scalable=no,
        initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    >
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bug Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- 
     LOGIN MODAL -->
<div id="loginModal" class="modal show">
    <div class="modal-content">
        <h2>Login</h2>

        <form id="loginForm">
            <label>Username</label>
            <input type="text" id="loginUsername" required />

            <label>Password</label>
            <input type="password" id="loginPassword" required />

            <button type="submit">Login</button>
        </form>

        <div id="loginError" style="color:red; margin-top:10px;"></div>
    </div>
</div>

<!--
     MAIN APP-->
<div class="container">

    <!-- Header -->
    <header class="header">
        <h1>Bug Tracker</h1>
        <div class="header-actions">
            <button id="newBugButton" class="btn btn1">New Bug</button>
        </div>
    </header>

    <!-- Bug List -->
    <div class="bug-list" id="bugList">
        <div class="bug-item">Loading bugs…</div>
    </div>

    <!--
         CREATE / EDIT BUG MODAL-->
    <div class="modal" id="bugModal">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title">New Bug</h1>
                <span class="close">&times;</span>
            </div>

            <form id="bugForm">

                <!-- used for edit -->
                <input type="hidden" id="bugId" name="id">
                <input type="hidden" id="testerId" name="tester_id" value="">

                <!-- Title -->
                <div class="form-group">
                    <label for="bugTitle">Title</label>
                    <input
                        id="bugTitle"
                        name="title"
                        type="text"
                        placeholder="e.g. Cannot login when password contains spaces"
                        maxlength="200"
                        required
                    />
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="bugDescription">Description / Steps to reproduce</label>
                    <textarea
                        id="bugDescription"
                        name="description"
                        rows="6"
                        placeholder="1) ... 2) ... 3) ..."
                        maxlength="2000"
                        required
                    ></textarea>
                </div>

                <!-- Priority and also  Status -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="bugPriority">Priority</label>
                        <select id="bugPriority" name="priority" required>
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="bugStatus">Status</label>
                        <select id="bugStatus" name="status" required>
                            <option value="OPEN">OPEN</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="CLOSED">CLOSED</option>
                            <option value="COMPLETED">COMPLETED</option>
                            <option value="FAILED">FAILED</option>
                        </select>
                    </div>
                </div>

                <!-- 
                     ASSIGN TO (NEW!!!! TAT) -->
                <div class="form-group">
                    <label for="bugAssignedTo">Assign To</label>
                    <select id="bugAssignedTo" name="assigned_to">
                        <option value="">Unassigned</option>
                        <option value="staff01">staff01</option>
                        <option value="staff02">staff02</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="modal-footer">
                    <button type="submit" class="btn btn1" id="saveBtn">
                        Save Bug
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- 
         VIEW BUG MODAL-->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title">Bug Details</h1>
                <span class="close">&times;</span>
            </div>
            <div class="view-content" id="viewContent">
                <!-- populated by JS -->
            </div>
        </div>
    </div>

</div>

<!-- Scripts -->
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
